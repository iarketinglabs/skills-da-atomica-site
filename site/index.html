<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#242b30">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>Skills da Atomica · Acesso restrito</title>
  <style>
    :root{color-scheme:dark;--paper:#242b30;--surface:#303a40;--ink:#f2efe6;--soft:#bac3c5;--line:#59656c;--green:#66cbc9;--cyan:#87e2dc;--yellow:#f2c14e;--red:#ff9693;--footer:#20272c}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font-family:Georgia,"Times New Roman",serif}
    body{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 18% 12%,rgba(102,203,201,.12),transparent 42%),radial-gradient(ellipse at 84% 86%,rgba(242,193,78,.08),transparent 38%),var(--paper)}
    .gate{width:min(440px,100%);padding:clamp(28px,7vw,54px);border:1px solid var(--line);border-radius:14px;background:var(--surface);box-shadow:8px 8px 0 #171d21}
    .brand{display:flex;align-items:center;gap:12px;margin-bottom:34px;font:700 13px/1.2 Arial,sans-serif;letter-spacing:.15em;text-transform:uppercase}.mark{width:34px;height:34px;display:grid;place-items:center;border:1px solid var(--ink);border-radius:50%;background:var(--yellow);color:#20272c;font:700 20px Georgia,serif}
    .eyebrow{margin:0 0 10px;color:var(--green);font:700 11px/1.4 Arial,sans-serif;letter-spacing:.16em;text-transform:uppercase}h1{margin:0;font-size:clamp(2.3rem,8vw,3.45rem);line-height:.98;letter-spacing:-.055em}h1 em{color:var(--green);font-weight:400}.intro{margin:18px 0 28px;color:var(--soft);font:16px/1.55 Arial,sans-serif}
    label{display:block;margin:17px 0 7px;font:700 12px/1.3 Arial,sans-serif;letter-spacing:.04em}input{width:100%;height:48px;padding:0 13px;border:1px solid var(--line);border-radius:7px;background:#20272c;color:var(--ink);font:16px Arial,sans-serif}input:focus{outline:3px solid var(--cyan);outline-offset:2px}
    button{width:100%;height:49px;margin-top:22px;border:1px solid var(--ink);border-radius:7px;background:var(--green);color:#172326;font:700 14px Arial,sans-serif;letter-spacing:.03em;cursor:pointer}button:hover{background:#87e2dc}button:focus-visible{outline:3px solid var(--cyan);outline-offset:3px}button:disabled{cursor:wait;opacity:.7}
    .status{min-height:22px;margin:12px 0 0;color:var(--red,#b8302f);font:13px/1.5 Arial,sans-serif}footer{margin-top:23px;color:var(--soft);font:11px/1.4 Arial,sans-serif;text-align:center}
    #portal{position:fixed;inset:0;background:var(--paper)}#site{display:block;width:100%;height:100%;border:0;background:var(--paper)}#logout{position:fixed;z-index:4;right:14px;bottom:14px;width:auto;height:auto;margin:0;padding:8px 12px;border:1px solid rgba(242,239,230,.35);border-radius:20px;background:rgba(48,58,64,.96);color:var(--ink);font:600 12px Arial,sans-serif;box-shadow:0 2px 8px #0005}#logout:hover{background:#3b484e}[hidden]{display:none!important}
    @media(max-width:520px){.gate{box-shadow:5px 5px 0 var(--ink)}.intro{font-size:15px}}
  </style>
</head>
<body>
  <main class="gate" id="gate">
    <div class="brand"><span class="mark" aria-hidden="true">A</span><span>Atomica · Biblioteca interna</span></div>
    <p class="eyebrow">Acesso restrito</p>
    <h1>Skills <em>da Atomica</em></h1>
    <p class="intro">Entre com as credenciais da Atomica para abrir o catálogo privado.</p>
    <form id="login-form" autocomplete="on">
      <label for="login">Login</label>
      <input id="login" name="username" autocomplete="username" required>
      <label for="password">Senha</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <button id="submit" type="submit">Entrar</button>
      <p class="status" id="status" role="status" aria-live="polite"></p>
    </form>
    <footer>O conteúdo é aberto no navegador após validar as credenciais.</footer>
  </main>
  <section id="portal" hidden aria-label="Catálogo privado">
    <iframe id="site" title="Skills da Atomica" sandbox="allow-scripts allow-top-navigation-by-user-activation"></iframe>
    <button id="logout" type="button" aria-label="Terminar sessão">Sair</button>
  </section>
  <script type="module">
    const BASE_PATH = "/skills-da-atomica-site";
    const ITERATIONS_MAX = 2_000_000;
    const form = document.querySelector('#login-form');
    const loginInput = document.querySelector('#login');
    const passwordInput = document.querySelector('#password');
    const submit = document.querySelector('#submit');
    const status = document.querySelector('#status');
    const gate = document.querySelector('#gate');
    const portal = document.querySelector('#portal');
    const frame = document.querySelector('#site');
    let payload = null;
    let activeRoute = `${BASE_PATH}/`;
    let nextHash = '';

    function fromBase64(value) {
      const binary = atob(value);
      return Uint8Array.from(binary, (character) => character.charCodeAt(0));
    }

    async function decrypt(envelope, login, password) {
      if (envelope?.version !== 1 || envelope.algorithm !== 'AES-256-GCM' || envelope.kdf !== 'PBKDF2-SHA256' || envelope.iterations < 10_000 || envelope.iterations > ITERATIONS_MAX) {
        throw new Error('Conteúdo indisponível.');
      }
      const material = await crypto.subtle.importKey('raw', new TextEncoder().encode(`${login}\0${password}`), 'PBKDF2', false, ['deriveKey']);
      const key = await crypto.subtle.deriveKey({name:'PBKDF2',salt:fromBase64(envelope.salt),iterations:envelope.iterations,hash:'SHA-256'}, material, {name:'AES-GCM',length:256}, false, ['decrypt']);
      const plain = await crypto.subtle.decrypt({name:'AES-GCM',iv:fromBase64(envelope.iv),tagLength:128}, key, fromBase64(envelope.ciphertext));
      return JSON.parse(new TextDecoder().decode(plain));
    }

    function routeFor(path) {
      const url = new URL(path, location.origin);
      if (url.origin !== location.origin || !(url.pathname === BASE_PATH || url.pathname.startsWith(`${BASE_PATH}/`))) return `${BASE_PATH}/404.html`;
      const route = url.pathname === BASE_PATH ? `${BASE_PATH}/` : url.pathname;
      return Object.hasOwn(payload.routes, route) ? route : `${BASE_PATH}/404.html`;
    }

    function showRoute(path, hash = '', replace = false) {
      activeRoute = routeFor(path);
      nextHash = hash;
      frame.srcdoc = payload.routes[activeRoute];
      const state = {route:activeRoute,hash};
      const fragment = `#page=${encodeURIComponent(activeRoute)}${hash ? `&anchor=${encodeURIComponent(hash.slice(1))}` : ''}`;
      history[replace ? 'replaceState' : 'pushState'](state, '', fragment);
    }

    function download(path) {
      const base64 = payload?.downloads?.[path];
      if (!base64) return;
      const bytes = fromBase64(base64);
      const url = URL.createObjectURL(new Blob([bytes], {type:'application/zip'}));
      const anchor = document.createElement('a');
      anchor.href = url;
      anchor.download = path.split('/').at(-1) || 'skill.zip';
      anchor.click();
      setTimeout(() => URL.revokeObjectURL(url), 60_000);
    }

    frame.addEventListener('load', () => {
      if (!nextHash) return;
      const id = decodeURIComponent(nextHash.slice(1));
      frame.contentWindow?.postMessage({type:'scroll',id}, '*');
      nextHash = '';
    });

    addEventListener('message', (event) => {
      if (event.origin !== 'null' || event.source !== frame.contentWindow || !payload) return;
      const data = event.data;
      if (data?.type === 'route' && typeof data.path === 'string') showRoute(data.path, typeof data.hash === 'string' ? data.hash : '');
      if (data?.type === 'download' && typeof data.path === 'string') download(data.path);
    });

    addEventListener('popstate', (event) => {
      if (payload && event.state?.route) showRoute(event.state.route, event.state.hash ?? '', true);
    });

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      if (!form.reportValidity()) return;
      submit.disabled = true;
      status.textContent = 'A validar acesso…';
      try {
        const response = await fetch(`${BASE_PATH}/content.enc`, {cache:'no-store'});
        if (!response.ok) throw new Error('Conteúdo indisponível.');
        const envelope = await response.json();
        payload = await decrypt(envelope, loginInput.value.trim(), passwordInput.value);
        loginInput.value = '';
        passwordInput.value = '';
        if (!payload.routes || !Object.keys(payload.routes).length || !payload.routes[`${BASE_PATH}/`]) throw new Error('Conteúdo indisponível.');
        gate.hidden = true;
        portal.hidden = false;
        showRoute(`${BASE_PATH}/`, '', true);
      } catch {
        payload = null;
        passwordInput.value = '';
        status.textContent = 'Login ou senha inválidos.';
        passwordInput.focus();
      } finally {
        submit.disabled = false;
      }
    });

    document.querySelector('#logout').addEventListener('click', () => {
      payload = null;
      frame.removeAttribute('srcdoc');
      portal.hidden = true;
      gate.hidden = false;
      loginInput.value = '';
      passwordInput.value = '';
      status.textContent = '';
      history.replaceState(null, '', location.pathname + location.search);
      loginInput.focus();
    });
  </script>
</body>
</html>
