name: Skills da Atomica · GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: skills-da-atomica-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check encrypted site files
        run: |
          test -s site/index.html
          test -s site/content.enc
          test -f site/.nojekyll
          expected="$(printf '.nojekyll\ncontent.enc\nindex.html')"
          actual="$(find site -mindepth 1 -printf '%P\n' | sort)"
          test "$actual" = "$expected"
          test "$(find site -mindepth 1 -type f | wc -l | tr -d ' ')" = 3
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
